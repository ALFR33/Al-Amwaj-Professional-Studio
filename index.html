<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salh Alheib Klel - Pro Circular Wave & Background Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #05070c; color: #f3f4f6; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b, #d97706, #b45309); }
        .gold-text { background: linear-gradient(135deg, #fde68a, #f59e0b, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Top Control Bar -->
    <header class="flex items-center justify-between px-4 py-2 bg-[#0b0f19] border-b border-gray-800 z-20 flex-wrap gap-2">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-black font-extrabold text-lg shadow-lg">👑</div>
            <div>
                <h1 class="text-sm font-bold gold-text">Salh Alheib Klel - Circular Wave Studio</h1>
                <p class="text-[11px] text-gray-400">Pro Large Circular Waves & Center Cover</p>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button onclick="document.getElementById('audioFile').click()" class="px-3 py-1.5 rounded-xl gold-gradient text-black font-bold text-xs shadow-md transition">
                🎵 Upload Music
            </button>
            <input type="file" id="audioFile" accept="audio/*" class="hidden" onchange="loadAudio(event)">

            <button onclick="document.getElementById('imageFile').click()" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md transition">
                🖼️ Upload Center Circle Cover
            </button>
            <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="loadImage(event)">

            <button onclick="document.getElementById('bgFile').click()" class="px-3 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs shadow-md transition">
                🎬 Upload Background (Image/Video)
            </button>
            <input type="file" id="bgFile" accept="image/*,video/*" class="hidden" onchange="loadBackground(event)">
            
            <!-- Colors -->
            <div class="flex items-center gap-1.5 bg-[#111827] px-2 py-1 rounded-xl border border-gray-700">
                <input type="color" id="colorStart" value="#f59e0b" class="w-5 h-5 rounded cursor-pointer bg-transparent border-0" title="Start Color">
                <input type="color" id="colorEnd" value="#38bdf8" class="w-5 h-5 rounded cursor-pointer bg-transparent border-0" title="End Color">
            </div>

            <!-- Record Button -->
            <button id="recordBtn" onclick="toggleRecording()" class="px-3 py-1.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs shadow-md transition flex items-center gap-1.5" disabled>
                <span id="recDot" class="w-2.5 h-2.5 rounded-full bg-white"></span>
                <span id="recText">Record & Export</span>
            </button>
        </div>
    </header>

    <!-- Main Display Area -->
    <main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
        <video id="bgVideoElement" class="absolute inset-0 w-full h-full object-cover opacity-50 hidden" loop muted playsinline></video>
        <canvas id="canvas" class="absolute inset-0 z-10"></canvas>
        
        <!-- Watermark -->
        <div class="absolute bottom-8 right-8 bg-black/70 backdrop-blur-md border border-amber-500/30 px-4 py-2 rounded-xl text-amber-300 font-bold text-xs tracking-wider shadow-2xl pointer-events-none z-20 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            <span>© Salh Alheib Klel - Master Studio</span>
        </div>

        <div id="trackInfo" class="absolute top-8 left-8 bg-black/70 backdrop-blur-md border border-gray-800 px-4 py-2.5 rounded-xl text-gray-200 text-xs pointer-events-none z-20 hidden">
            <p id="fileName" class="font-bold text-amber-400 truncate max-w-xs">Track: Ready</p>
        </div>
    </main>

    <!-- Bottom Audio Footer -->
    <footer class="flex items-center justify-between px-6 py-3 bg-[#0b0f19] border-t border-gray-800 z-20 flex-col sm:flex-row gap-2">
        <div class="flex items-center gap-4 w-full max-w-md">
            <button id="playBtn" onclick="togglePlay()" class="w-10 h-10 rounded-xl bg-amber-500 text-black font-bold flex items-center justify-center shadow-md transition" disabled>
                ▶
            </button>
            <div class="flex-1 flex flex-col gap-1">
                <div class="flex justify-between text-[11px] text-gray-400 font-mono">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
                <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)" class="w-full accent-amber-500 cursor-pointer h-1.5 bg-gray-800 rounded-lg">
            </div>
        </div>
        <div class="flex flex-col items-center sm:items-end gap-1">
            <div id="statusMsg" class="text-xs text-amber-400 font-mono">
                Upload center circle cover & music to start big circular waves
            </div>
            <div class="text-[11px] text-gray-400 font-semibold">
                جميع الحقوق محفوضه للفنان Salh Alheib Klel
            </div>
        </div>
    </footer>

    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioElement');
        const bgVideoElement = document.getElementById('bgVideoElement');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const seekBar = document.getElementById('seekBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const trackInfo = document.getElementById('trackInfo');
        const fileNameEl = document.getElementById('fileName');
        const colorStartInput = document.getElementById('colorStart');
        const colorEndInput = document.getElementById('colorEnd');
        const recordBtn = document.getElementById('recordBtn');
        const recText = document.getElementById('recText');
        const recDot = document.getElementById('recDot');
        const statusMsg = document.getElementById('statusMsg');

        let audioCtx, analyser, source, dataArray, dest;
        let isInitialized = false;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let centerImage = null;
        let bgImage = null;
        let isVideoBg = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 130;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function loadImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const imgUrl = URL.createObjectURL(file);
            centerImage = new Image();
            centerImage.src = imgUrl;
            statusMsg.textContent = "Center circle cover loaded successfully!";
        }

        function loadBackground(event) {
            const file = event.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video')) {
                bgVideoElement.src = url;
                bgVideoElement.classList.remove('hidden');
                bgVideoElement.play();
                isVideoBg = true;
                bgImage = null;
                statusMsg.textContent = "Background video loaded successfully!";
            } else {
                bgVideoElement.classList.add('hidden');
                bgVideoElement.pause();
                isVideoBg = false;
                bgImage = new Image();
                bgImage.src = url;
                statusMsg.textContent = "Background image loaded successfully!";
            }
        }

        function loadAudio(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            audio.src = fileURL;
            audio.load();

            fileNameEl.textContent = "Track: " + file.name;
            trackInfo.classList.remove('hidden');

            audio.onloadedmetadata = () => {
                durationEl.textContent = formatTime(audio.duration);
                seekBar.max = audio.duration;
                playBtn.disabled = false;
                recordBtn.disabled = false;
            };

            if (!isInitialized) {
                initAudioContext();
            }
        }

        function initAudioContext() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            
            dest = audioCtx.createMediaStreamDestination();
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.connect(dest);
            
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            isInitialized = true;
            drawVisualizer();
        }

        function togglePlay() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
                if (isVideoBg) bgVideoElement.play();
            } else {
                audio.pause();
                playBtn.textContent = '▶';
                if (isVideoBg) bgVideoElement.pause();
            }
        }

        audio.ontimeupdate = () => {
            if (!audio.seeking) {
                seekBar.value = audio.currentTime;
            }
            currentTimeEl.textContent = formatTime(audio.currentTime);
        };

        function seekAudio(val) {
            audio.currentTime = val;
            if (isVideoBg) bgVideoElement.currentTime = val;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            const canvasStream = canvas.captureStream(30);
            const audioTrack = dest.stream.getAudioTracks()[0];
            if (audioTrack) {
                canvasStream.addTrack(audioTrack);
            }

            try {
                mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp9' });
            } catch (e) {
                mediaRecorder = new MediaRecorder(canvasStream);
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'Salh_Alheib_Klel_Circular_Studio.webm';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
                statusMsg.textContent = "Circular video exported and downloaded successfully!";
            };

            mediaRecorder.start();
            isRecording = true;
            recText.textContent = "Stop & Export";
            recDot.classList.add('animate-ping');
            statusMsg.textContent = "Recording circular video and audio...";
            
            if (audio.paused) {
                togglePlay();
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            recText.textContent = "Record & Export";
            recDot.classList.remove('animate-ping');
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);

            if (bgImage && bgImage.complete) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (!isVideoBg) {
                ctx.fillStyle = '#05070c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            const colStart = colorStartInput.value;
            const colEnd = colorEndInput.value;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const circleRadius = 130;

            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * 220;
                const rad = (i * Math.PI * 2) / dataArray.length;

                const xStart = centerX + Math.cos(rad) * (circleRadius + 10);
                const yStart = centerY + Math.sin(rad) * (circleRadius + 10);
                const xEnd = centerX + Math.cos(rad) * (circleRadius + 15 + barHeight);
                const yEnd = centerY + Math.sin(rad) * (circleRadius + 15 + barHeight);

                const gradient = ctx.createLinearGradient(xStart, yStart, xEnd, yEnd);
                gradient.addColorStop(0, colStart);
                gradient.addColorStop(1, colEnd);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(xStart, yStart);
                ctx.lineTo(xEnd, yEnd);
                ctx.stroke();
            }

            if (centerImage && centerImage.complete) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, circleRadius, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(centerImage, centerX - circleRadius, centerY - circleRadius, circleRadius * 2, circleRadius * 2);
                ctx.restore();
            } else {
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, circleRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#111827';
                ctx.fill();
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, circleRadius, 0, Math.PI * 2);
            ctx.strokeStyle = colStart;
            ctx.lineWidth = 6;
            ctx.stroke();
        }
    </script>
</body>
</html>
